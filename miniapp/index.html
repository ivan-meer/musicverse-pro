<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicVerse Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <h1>🎵 MusicVerse Pro</h1>
            <p class="subtitle">Your Personal Music Companion</p>
        </header>

        <!-- Main Content -->
        <main class="app-content">
            <!-- User Info Section -->
            <section id="user-section" class="section">
                <div class="user-info">
                    <h2>Welcome, <span id="user-name">User</span>!</h2>
                    <p id="user-id"></p>
                </div>
            </section>

            <!-- Navigation Tabs -->
            <nav class="tabs">
                <button class="tab-button active" data-tab="discover">Discover</button>
                <button class="tab-button" data-tab="playlists">Playlists</button>
                <button class="tab-button" data-tab="favorites">Favorites</button>
            </nav>

            <!-- Discover Tab -->
            <section id="discover-tab" class="tab-content active">
                <h3>🎧 Recommended for You</h3>
                <div id="recommendations-list" class="music-list">
                    <div class="loading">Loading recommendations...</div>
                </div>
            </section>

            <!-- Playlists Tab -->
            <section id="playlists-tab" class="tab-content">
                <h3>📚 Your Playlists</h3>
                <div id="playlists-list" class="playlists-container">
                    <p class="empty-state">No playlists yet. Create your first playlist!</p>
                    <button class="btn btn-primary" id="create-playlist-btn">+ Create Playlist</button>
                </div>
            </section>

            <!-- Favorites Tab -->
            <section id="favorites-tab" class="tab-content">
                <h3>❤️ Your Favorites</h3>
                <div id="favorites-list" class="music-list">
                    <p class="empty-state">No favorites yet. Start adding tracks you love!</p>
                </div>
            </section>
        </main>

        <!-- Bottom Actions -->
        <footer class="app-footer">
            <button id="send-data-btn" class="btn btn-primary">Send to Bot</button>
            <button id="close-app-btn" class="btn btn-secondary">Close</button>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
